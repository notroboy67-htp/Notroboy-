name: NRB Fast Client

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java
        shell: pwsh
        run: |
          winget install --id EclipseAdoptium.Temurin.21.JDK `
            --exact --silent `
            --accept-package-agreements `
            --accept-source-agreements

          if ($LASTEXITCODE -ne 0) {
            throw "Java installation failed."
          }

      - name: Install VS Code and Git
        shell: pwsh
        run: |
          $packages = @(
            "Microsoft.VisualStudioCode",
            "Git.Git",
            "Kitware.CMake",
            "Microsoft.VCRedist.2015+.x64"
          )

          foreach ($package in $packages) {
            Write-Host "Installing $package"

            winget install --id $package --exact --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "$package installation returned an error."
            }
          }

      - name: Install OpenGL Development Libraries
        shell: pwsh
        run: |
          # Install vcpkg for native graphics dependencies.
          if (-not (Test-Path "C:\vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          }

          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed."
          }

          # GLFW and GLEW are useful for OpenGL development.
          & C:\vcpkg\vcpkg.exe install glfw3:x64-windows glew:x64-windows

          if ($LASTEXITCODE -ne 0) {
            throw "OpenGL development dependency installation failed."
          }

      - name: Create NRB User
        shell: pwsh
        run: |
          $username = "NRB"
          $password = ConvertTo-SecureString "NRB" -AsPlainText -Force

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $username `
              -Password $password `
              -Description "NRB Fast Client"
          }

          Write-Host "NRB user configured."

      - name: Install Tailscale
        shell: pwsh
        run: |
          winget install --id Tailscale.Tailscale `
            --exact --silent `
            --accept-package-agreements `
            --accept-source-agreements

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale installation failed."
          }

      - name: Authenticate Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Configure the TS_AUTHKEY repository secret."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable not found."
          }

          Start-Service Tailscale

          & $tailscale up `
            "--auth-key=$env:TS_AUTHKEY" `
            "--hostname=nrb-fast-client"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale authentication failed."
          }

          & $tailscale ip -4

      - name: Show Environment Information
        shell: pwsh
        run: |
          Write-Host "NRB Fast Client environment configured."
          Write-Host "Username: NRB"
          Write-Host "Password: NRB"
          Write-Host "Java, VS Code, Git and OpenGL development libraries configured."
