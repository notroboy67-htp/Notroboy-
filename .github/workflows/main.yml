name: NRB Fast Client Windows

on:
  workflow_dispatch:

jobs:
  setup-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Development Tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packages = @(
            "Git.Git",
            "Microsoft.VisualStudioCode",
            "Python.Python.3.12",
            "Microsoft.VCRedist.2015+.x64",
            "Tailscale.Tailscale"
          )

          foreach ($package in $packages) {
            Write-Host "Installing $package"

            winget install --id $package --exact --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "$package returned exit code $LASTEXITCODE"
            }
          }

          $env:PATH += ";C:\Program Files\Git\cmd"

      - name: Install Visual C++ Build Tools
        shell: pwsh
        run: |
          winget install `
            --id Microsoft.VisualStudio.2022.BuildTools `
            --exact --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --override "--wait --quiet --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Visual C++ Build Tools installation returned an error."
          }

      - name: Install OpenGL Development Dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Install CMake for native graphics projects
          winget install --id Kitware.CMake --exact --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "CMake installation returned an error."
          }

          # Install the Vulkan SDK, useful for graphics development
          winget install --id KhronosGroup.VulkanSDK --exact --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Vulkan SDK installation returned an error."
          }

          # Install Mesa OpenGL utilities/libraries through vcpkg
          if (-not (Test-Path "C:\vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          }

          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed."
          }

          & C:\vcpkg\vcpkg.exe install mesa:x64-windows

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Mesa package installation failed; see build logs."
          }

      - name: Create NRB User
        shell: pwsh
        run: |
          $username = "NRB"
          $password = ConvertTo-SecureString "NRB" -AsPlainText -Force

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $username `
              -Password $password `
              -Description "NRB Fast Client User"
          }

          Write-Host "NRB user setup completed."

      - name: Authenticate Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Add TS_AUTHKEY to GitHub repository secrets."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            $tailscale = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          }

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable not found."
          }

          Start-Service Tailscale

          & $tailscale up `
            "--auth-key=$env:TS_AUTHKEY" `
            "--hostname=nrb-fast-client"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale authentication failed."
          }

          & $tailscale ip -4

      - name: Final Setup
        shell: pwsh
        run: |
          Write-Host "NRB Fast Client setup finished."
          Write-Host "Username: NRB"
          Write-Host "Password: NRB"
          Write-Host "VS Code, Python, Git and graphics dependencies were configured."
